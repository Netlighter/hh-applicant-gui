<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Applicant Tool</title>
    <link rel="icon" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/vendor/xterm.min.css" />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="28" height="28">
              <rect width="32" height="32" rx="8" fill="#ef3b2f" />
              <circle cx="16" cy="16" r="4.2" fill="none" stroke="#fff" stroke-width="1.7" />
              <path fill="#fff" d="M15 3h2v4.2h-2zm0 21.6h2V29h-2zM3 15h4.2v2H3zm21.6 0H29v2h-4.4zM6.1 7.5l1.4-1.4 3 3-1.4 1.4zm15.4 15.4 1.4-1.4 3 3-1.4 1.4zM7.5 25.9l-1.4-1.4 3-3 1.4 1.4zm15.4-15.4-1.4-1.4 3-3 1.4 1.4z" />
            </svg>
          </span>
          <div>
            <strong>Applicant Tool</strong>
            <small>локальная панель</small>
          </div>
        </div>
        <div class="jobs" id="jobs">
          <button type="button" class="jobs-btn" id="jobs-btn" aria-haspopup="menu" aria-expanded="false">
            <span class="led" id="jobs-led"></span>
            <span id="jobs-label">Ничего не запущено</span>
          </button>
          <div class="jobs-menu" id="jobs-menu" hidden role="menu"></div>
        </div>
        <div class="top-controls" id="top-controls"></div>
      </header>
      <div class="body">
        <nav id="nav" aria-label="Разделы"></nav>
        <main id="main"></main>
      </div>
      <section class="dock collapsed" id="dock" aria-label="Журнал команд">
        <div class="dock-resizer" id="dock-resizer" title="Потяните, чтобы изменить высоту"></div>
        <div class="dock-bar">
          <div class="dock-tabs" id="dock-tabs"></div>
          <div class="dock-actions">
            <button type="button" class="ghost sm" id="dock-stop" disabled>Стоп</button>
            <button type="button" class="ghost sm" id="dock-clear">Очистить</button>
            <button type="button" class="ghost sm" id="dock-copy">Копировать</button>
            <button type="button" class="ghost sm" id="dock-hide">Скрыть</button>
          </div>
        </div>
        <p class="dock-hint" id="dock-hint">
          Журнал можно скрыть. Команда при этом не останавливается и остаётся в индикаторе сверху, пока выполняется.
        </p>
        <div class="dock-term">
          <div id="terminal-empty" class="terminal-empty">Журнал появится, когда запустите команду.</div>
          <div id="terminal-host"></div>
        </div>
      </section>
    </div>
    <div id="toasts"></div>
    <div id="modal-root" hidden></div>
    <script src="/static/vendor/xterm.min.js"></script>
    <script src="/static/vendor/xterm-addon-fit.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
